<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="SLY Company — Collection 001 Roots."
    >

    <title>Collection — SLY Company</title>


    <!-- GOOGLE FONTS -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- BOOTSTRAP -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- ICONS -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<!-- NAVBAR -->

<header class="site-header">

    <nav class="navbar navbar-expand-lg">

        <div class="container-fluid px-3 px-lg-4">


            <div
                class="collapse navbar-collapse order-2 order-lg-1"
                id="mainNavbar"
            >

                <ul class="navbar-nav gap-lg-4">

                    <li class="nav-item">

                        <a class="nav-link"
                           href="index.html">

                            Home

                        </a>

                    </li>


                    <li class="nav-item">

                        <a class="nav-link"
                           href="about.html">

                            About

                        </a>

                    </li>


                    <li class="nav-item">

                        <a class="nav-link active"
                           href="items.html">

                            Collection

                        </a>

                    </li>


                    <li class="nav-item">

                        <a class="nav-link"
                           href="contact.html">

                            Contact

                        </a>

                    </li>

                </ul>

            </div>


            <a
                class="navbar-brand sly-logo order-1 order-lg-2"
                href="index.html"
            >

                SLY

            </a>


            <div class="navbar-actions order-3">


                <button
                    class="cart-button"
                    type="button"
                    data-bs-toggle="offcanvas"
                    data-bs-target="#cartCanvas"
                >

                    <i class="bi bi-bag"></i>

                    <span class="cart-count">
                        0
                    </span>

                </button>


                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#mainNavbar"
                >

                    <i class="bi bi-list"></i>

                </button>


            </div>

        </div>

    </nav>

</header>



<main>


<!-- =====================================
     COLLECTION HEADER
===================================== -->

<section class="editorial-hero collection-header">

    <div class="container-fluid px-4 px-lg-5">


        <p class="eyebrow">

            COLLECTION 001

        </p>


        <h1 class="editorial-title">

            ROOTS

        </h1>


        <p class="editorial-subtitle">

            A study in references,
            identity and urban culture.

        </p>


    </div>

</section>



<!-- =====================================
     FILTROS
===================================== -->

<section class="filter-section">

    <div class="container-fluid px-4 px-lg-5">

        <div class="filter-wrapper">


            <p class="products-counter">

                <span id="product-count">
                    0
                </span>

                PIECES

            </p>


            <div class="filter-buttons">


                <button
                    class="filter-btn active"
                    data-filter="all"
                >

                    ALL

                </button>


                <button
                    class="filter-btn"
                    data-filter="tee"
                >

                    TEES

                </button>


                <button
                    class="filter-btn"
                    data-filter="hoodie"
                >

                    HOODIE

                </button>


            </div>

        </div>

    </div>

</section>



<!-- =====================================
     PRODUTOS
===================================== -->

<section class="section products-section">

    <div class="container-fluid px-4 px-lg-5">

        <div
            class="row g-4"
            id="products-grid"
        ></div>

    </div>

</section>


</main>



<footer id="site-footer"></footer>


<div id="cart-container"></div>

<div id="product-modal-container"></div>



<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>

<script src="js/script.js"></script>


</body>

</html>
